[project]
name = "cc-patch"
version = "0.1.0"
description = "Unified Claude Code binary patch manager"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
ccpatch = "cc_patch.cli:main_entry"
cc-patch = "cc_patch.cli:main_entry"

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
    "pyte>=0.8.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
